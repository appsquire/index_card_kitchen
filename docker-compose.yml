version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: recipebox-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipebox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipebox_secret}
      POSTGRES_DB: ${POSTGRES_DB:-recipebox}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipebox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipebox-server
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-recipebox}:${POSTGRES_PASSWORD:-recipebox_secret}@postgres:5432/${POSTGRES_DB:-recipebox}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Optional: Run migrations on startup
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipebox-migrate
    command: npm run migrate
    working_dir: /app/server
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recipebox}:${POSTGRES_PASSWORD:-recipebox_secret}@postgres:5432/${POSTGRES_DB:-recipebox}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
